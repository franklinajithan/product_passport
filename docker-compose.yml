services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gpr
      POSTGRES_PASSWORD: gpr
      POSTGRES_DB: gpr
    ports:
      - "5433:5432"
    volumes:
      - gpr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpr -d gpr"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

volumes:
  gpr_pgdata:
